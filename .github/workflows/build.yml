name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # build.bat finds Visual Studio through vswhere and builds with MSVC and
      # the static C runtime (the MinGW fallback is for local builds only)
      - name: Build FolderHeat.exe
        shell: cmd
        run: build.bat

      - name: Size and SHA-256
        shell: pwsh
        run: |
          $f = Get-Item FolderHeat.exe
          "Size: $($f.Length) bytes"
          "SHA-256: $((Get-FileHash $f -Algorithm SHA256).Hash)"

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: FolderHeat-${{ github.sha }}
          path: FolderHeat.exe
          if-no-files-found: error
          retention-days: 30
